#
#  Unused stages. 
#
#################################################

[aggregate-data-genehyb]
desc = Aggregate and assign cellids for geneseq and hyb
maptype = cycle
modes = hyb
stagedir = merge
instage = merge-dummy
instage_mode = hyb,geneseq
arity = single
file_regex = rolonies_genehyb
label = rolonies_genehyb
ext = joblib
strip_base = True
script_base = aggregate-data-genehyb
tool = np 

[aggregate-data-bcseq]
desc = Aggregate bcseq cellids. 
maptype = cycle
modes = bcseq, hyb
stagedir = merge
instage = merge-dummy
instage_mode = hyb,bcseq
arity = single
file_regex = rolonies_bcseq
label = rolonies_bcseq
ext = joblib
strip_base = True
script_base = aggregate-data-bcseq
tool = np

[aggregate-data-all-genehyb]
desc = Aggregate all geneseq and hyb data further. 
maptype = cycle
modes = hyb
stagedir = merge
instage = merge-dummy
instage_mode = hyb, geneseq
arity = single
file_regex = processeddata, alldata
label = processeddata
ext = joblib
strip_base = True
script_base = aggregate-data-all-genehyb
tool = np

codebook_geneseq_file = HTNA24.codebook_geneseq.tsv
codebook_hyb_file = HTNA24.codebook_hyb.tsv
tilesize=3200
fraction_border=0.07

[aggregate-data-all-genehybbcseq]
desc = Alternate--aggregate data further taking geneseq, hyb, and bcseq input.  
maptype = cycle
modes = hyb
stagedir = merge
instage = merge-dummy
instage_mode = hyb, geneseq, bcseq
arity = single
file_regex = processeddata, alldata
label = alldata
ext = joblib
strip_base = True
script_base = aggregate-data-all-genehybbcseq
tool = np

codebook_geneseq_file = HTNA24.codebook_geneseq.tsv
codebook_hyb_file = HTNA24.codebook_hyb.tsv
tilesize=3200
fraction_border=0.07

[filter-data]
desc = Remove overlapping double-counted data.
maptype = cycle
modes = hyb
#stagedir = aggregated
stagedir = merge
instage = aggregate-data-all-genehybbcseq
instage_mode = hyb
arity = single
file_regex = filt_neurons
label = filt_neurons
ext = joblib
strip_base = True
script_base = filter-data
tool = np

rescale_factor = 0.5
px = 0.33
box_half_width_um = 5
search_radius_um = 200

[add-somabc]
desc = Add bcseq barcodes to output data. 
maptype = cycle
modes = hyb
stagedir = merge
instage = merge-dummy
instage_mode = hyb,bcseq
arity = single
file_regex = filt_neurons_bcseq
label = filt_neurons_bcseq
ext = joblib
strip_base = True
script_base = add-somabc
tool = np

complexity_thresh = -0.9
score_thresh = 0.85
signal_thresh = 150.0
count_thresh = 3
err_corr_thresh = 2 