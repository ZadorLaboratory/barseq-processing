[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "barseq-processing"
version = "1.0.0"

description = "Data processing forBARseq"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
authors = [
  { name="John Hover", email="hover@cshl.edu" },
]

dependencies = [
 	"h5py",
	"imageio",
	"ipython",
	"joblib",
	"jupyter",
	"natsort",
 	"networkx",
 	"numpy",
	"opencv-python", 
	"pandas",
 	"scikit-image", 
 	"scipy",
	"tifffile", 
]

[tool.setuptools.packages.find]
include = ["barseq*"]

[project.scripts]
process_workflow = "barseq.cli:process_workflow_cli"
# aggregate_cellids_py = "barseq.cli:aggregate_cellids_py_cli" 
# aggregate_data_py = "barseq.cli:aggregate_data_py_cli"
# aggregate_transform_np = "barseq.cli:aggregate_transform_np_cli"
# background_cv2 = "barseq.cli:background_cv2_cli"
# basecall_geneseq_bardensr = "barseq.cli:basecall_geneseq_bardensr_cli"
# basecall_hyb_ski = "barseq.cli:basecall_hyb_ski_cli"

[project.urls]
Homepage = "https://github.com/ZadorLaboratory/barseq-processing"
Issues = "https://github.com/ZadorLaboratory/barseq-processing/issues"